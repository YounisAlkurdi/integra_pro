<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integra | System Overseer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#020617', 
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-obsidian text-white relative min-h-screen">
    
    <!-- Ambient Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-amber-400/10 blur-[120px] rounded-full mix-blend-screen animate-pulse-slow"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-orange-400/10 blur-[150px] rounded-full mix-blend-screen animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <!-- Sidebar (Gold Accent) -->
    <aside class="hidden md:flex fixed left-0 top-0 h-full w-20 flex-col items-center py-8 z-[60] glass-panel border-r border-amber-500/10 backdrop-blur-2xl bg-obsidian/40">
        <div class="mb-12">
            <div class="w-10 h-10 rounded-xl bg-amber-400 flex items-center justify-center shadow-[0_0_20px_rgba(251,191,36,0.4)]">
                <span class="text-obsidian font-black text-xl">S</span>
            </div>
        </div>

        <nav class="flex-1 flex flex-col gap-8">
            <a href="admin-center.html" class="sidebar-link active text-amber-400" title="System Status">
                <i data-lucide="activity" class="w-5 h-5"></i>
            </a>
            <a href="#" class="sidebar-link hover-target" title="Global Users">
                <i data-lucide="users" class="w-5 h-5"></i>
            </a>
            <a href="#" class="sidebar-link hover-target" title="Enterprise Nodes">
                <i data-lucide="globe" class="w-5 h-5"></i>
            </a>
            <a href="dashboard.html" class="sidebar-link hover-target" title="Personal View">
                <i data-lucide="layout" class="w-5 h-5"></i>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-20 min-h-screen relative z-10 px-6 py-8">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <div>
                <h1 class="text-4xl font-black tracking-tighter mb-2 bg-gradient-to-r from-amber-400 to-white/40 bg-clip-text text-transparent uppercase italic">Overseer Terminal</h1>
                <p class="text-xs font-mono uppercase tracking-[0.3em] text-amber-400/60">Global Synchronization Active</p>
            </div>
            
            <div class="flex gap-4">
                <button id="add-org-btn" class="px-6 py-3 rounded-xl bg-amber-400 text-obsidian font-bold text-xs uppercase tracking-widest hover:scale-105 transition-all shadow-[0_0_20px_rgba(251,191,36,0.2)]">
                    Register Organization
                </button>
            </div>
        </header>

        <!-- Global Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="glass-panel p-6 rounded-3xl border border-white/5 bg-white/[0.02]">
                <div class="text-[10px] font-mono text-white/40 uppercase tracking-widest mb-1">Total Enterprises</div>
                <div class="text-3xl font-black text-amber-400" id="global-org-count">--</div>
            </div>
            <div class="glass-panel p-6 rounded-3xl border border-white/5 bg-white/[0.02]">
                <div class="text-[10px] font-mono text-white/40 uppercase tracking-widest mb-1">Total Operators</div>
                <div class="text-3xl font-black" id="global-user-count">--</div>
            </div>
            <div class="glass-panel p-6 rounded-3xl border border-white/5 bg-white/[0.02]">
                <div class="text-[10px] font-mono text-white/40 uppercase tracking-widest mb-1">System Load</div>
                <div class="text-3xl font-black text-green-400">Stable</div>
            </div>
            <div class="glass-panel p-6 rounded-3xl border border-white/5 bg-white/[0.02]">
                <div class="text-[10px] font-mono text-white/40 uppercase tracking-widest mb-1">Neural Sync</div>
                <div class="text-3xl font-black text-cyan-400">99.9%</div>
            </div>
        </div>

        <!-- Management Sections -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Organizations -->
            <div class="lg:col-span-7">
                <section class="glass-panel p-8 rounded-3xl border border-white/5 bg-white/[0.01]">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-xl font-bold flex items-center gap-3">
                            <i data-lucide="globe" class="w-5 h-5 text-amber-400"></i>
                            Organizations
                        </h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="text-[10px] font-mono uppercase tracking-widest text-white/20 border-b border-white/5">
                                <tr>
                                    <th class="pb-4">Org Name</th>
                                    <th class="pb-4">Tier</th>
                                    <th class="pb-4 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody id="org-list-body" class="divide-y divide-white/5">
                                <!-- Dynamic -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- Global Access Matrix -->
            <div class="lg:col-span-5">
                <section class="glass-panel p-8 rounded-3xl border border-white/5 bg-white/[0.01]">
                    <h2 class="text-xl font-bold mb-8 flex items-center gap-3">
                        <i data-lucide="key" class="w-5 h-5 text-amber-400"></i>
                        Access Matrix
                    </h2>
                    <div id="user-access-container" class="space-y-4">
                        <!-- User Item -->
                        <div class="p-4 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between">
                            <div>
                                <div class="text-sm font-bold">Admin@integra.ai</div>
                                <div class="text-[10px] font-mono text-white/40">Role: ADMIN</div>
                            </div>
                            <button class="p-2 rounded-xl bg-white/5 border border-white/10 hover:bg-amber-400 hover:text-obsidian transition-all">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Register Org Modal (Hidden) -->
    <div id="org-modal" class="fixed inset-0 z-[100] bg-obsidian/90 backdrop-blur-md hidden items-center justify-center p-6">
        <div class="w-full max-w-md glass-panel p-8 rounded-3xl border border-amber-500/20 shadow-[0_0_50px_rgba(251,191,36,0.1)]">
            <h2 class="text-2xl font-bold mb-6 text-amber-400 uppercase">New Organization</h2>
            <form id="org-form" class="space-y-4">
                <div>
                    <label class="text-[10px] font-mono text-white/40 uppercase mb-1 block">Org Name</label>
                    <input type="text" id="new-org-name" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-amber-400 transition-all text-sm" placeholder="CyberDyne Systems...">
                </div>
                <div>
                    <label class="text-[10px] font-mono text-white/40 uppercase mb-1 block">Tier</label>
                    <select id="new-org-tier" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-amber-400 transition-all text-sm appearance-none">
                        <option value="FREE">Free Tier</option>
                        <option value="PRO">Pro Enterprise</option>
                        <option value="GOV">Gov / Secret</option>
                    </select>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" id="close-modal" class="flex-1 py-4 rounded-2xl bg-white/5 border border-white/10 font-bold text-sm">CANCEL</button>
                    <button type="submit" class="flex-1 py-4 rounded-2xl bg-amber-400 text-obsidian font-bold text-sm">INITIALIZE</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase } from '../js/core/supabase-client.js';
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                console.warn("No active identity found. Routing to entry point...");
                window.location.href = 'index.html';
                return;
            }
            
            // Verify ADMIN role
            try {
                const response = await fetch('http://127.0.0.1:8000/api/user/profile', {
                    headers: {
                        'Authorization': `Bearer ${session.access_token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.role !== 'ADMIN') {
                        console.error("Unauthorized access attempt. Not an admin.");
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("Error verifying access:", error);
                window.location.href = 'index.html';
            }
        });
    </script>
    <script src="../js/core/settings.js"></script>
    <script src="../js/pages/admin-center.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
